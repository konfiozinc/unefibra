name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # El blog público se genera desde Firestore. Esta ejecución diaria publica los
  # artículos marcados como PUBLICADO en el panel, sin tocar el repositorio.
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC = 5:00 a.m. en Colombia

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Escribe blog/index.html y blog/<slug>/index.html con los artículos
      # publicados, y actualiza sitemap.xml. El script siempre termina con
      # código 0: si Firestore no responde deja una página honesta en lugar de
      # romper el despliegue del sitio. Por eso `continue-on-error`.
      - name: Generar el blog estático
        continue-on-error: true
        run: node tools/generar-blog.js

      # Al sitio sube SOLO lo público. Antes se publicaba el repositorio entero y
      # quedaban descargables las reglas de Firestore, el código de las Cloud
      # Functions y las herramientas internas: información útil para quien busque
      # por dónde entrar, aunque no contuvieran credenciales.
      # `set -e` a propósito: si falta un archivo, es mejor que falle el despliegue
      # (y siga en pie la versión anterior) que publicar un sitio incompleto.
      - name: Preparar el sitio público
        run: |
          set -e
          mkdir -p _sitio
          cp index.html privacidad.html manifest.json sw.js robots.txt sitemap.xml _sitio/
          cp -r assets admin blog _sitio/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_sitio"

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
