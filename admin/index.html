<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#102050" />
  <title>Acceso — UneFibra</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/admin.css" />

  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    }
  }
  </script>
  <link rel="icon" href="../assets/icons/favicon.png" type="image/png" />
    <meta name="description" content="Tarjeta digital de UneFibra SAS: contacto, servicios y ubicación en un solo enlace. Creada por KONFÍO ZINC.">
    <meta property="og:title" content="UneFibra SAS">
    <meta property="og:description" content="Tarjeta digital de UneFibra SAS: contacto, servicios y ubicación en un solo enlace. Creada por KONFÍO ZINC.">
    <meta property="og:image" content="https://konfiozinc.github.io/card/assets/img/og/og-tarjetas-digitales.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="KONFÍO ZINC">
    <meta property="og:locale" content="es_CO">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body class="login-body">
  <div class="login-box" id="login-box">
    <span class="brand__name">UneFibra</span>
    <p class="login-sub">Panel administrativo</p>

    <form id="login-form" novalidate>
      <label class="field">
        <span>Correo electrónico</span>
        <input type="email" name="email" autocomplete="username" required placeholder="admin@unefibra.co" />
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input type="password" name="password" autocomplete="current-password" required placeholder="••••••••" />
      </label>
      <button type="submit" class="btn btn--primary btn--block" id="login-submit">Iniciar sesión</button>
      <p class="login-msg" id="login-msg" role="status" aria-live="polite"></p>
    </form>

    <a class="login-back" href="../index.html">← Volver al sitio público</a>
  </div>

  <script src="../assets/js/config.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
