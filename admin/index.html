<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#102050" />
  <title>Acceso — UneFibra</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/admin.css" />

  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    }
  }
  </script>
</head>
<body class="login-body">
  <div class="login-box" id="login-box">
    <span class="brand__name">UneFibra</span>
    <p class="login-sub">Panel administrativo</p>

    <form id="login-form" novalidate>
      <label class="field">
        <span>Correo electrónico</span>
        <input type="email" name="email" autocomplete="username" required placeholder="correo@unefibras.co" />
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input type="password" name="password" autocomplete="current-password" required placeholder="••••••••" />
      </label>
      <button type="submit" class="btn btn--primary btn--block" id="login-submit">Iniciar sesión</button>
      <p class="login-msg" id="login-msg" role="status" aria-live="polite"></p>
    </form>

    <a class="login-back" href="../index.html">← Volver al sitio público</a>
  </div>

  <script src="../assets/js/config.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
