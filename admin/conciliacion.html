<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Conciliación de servicios — UneFibra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
  <script type="importmap">
  { "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
      "firebase/functions": "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js"
  } }
  </script>
  <link rel="icon" href="../assets/icons/favicon.png" type="image/png" />
  <style>
    /* KZ-UNEF-008 · Objetivos táctiles: la auditoría objetiva detectó selects de
       19 px y casillas de 13 px. En un móvil eso no se acierta con el pulgar. */
    #app-content select, #app-content .search input { min-height: 40px; padding: 8px 10px; }
    #app-content td input.sel { width: 24px; height: 24px; min-width: 24px; min-height: 24px; margin: 0; accent-color: currentColor; }
    #app-content tbody td:first-child { padding-block: 12px; }
    #app-content .btn { min-height: 36px; }
    #app-content .modal .btn { min-height: 40px; }
    @media (max-width: 480px) {
      #app-content .toolbar { gap: 10px; }
      #app-content .toolbar > * { flex: 1 1 100%; }
      #app-content .btn { min-height: 44px; }
      #app-content td input.sel { width: 28px; height: 28px; }
    }
  </style>
</head>
<body>
  <div id="app-shell"></div>
  <script src="../assets/js/config.js"></script>
  <script type="module" src="conciliacion.js"></script>
</body>
</html>
