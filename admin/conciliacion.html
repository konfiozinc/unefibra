<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Conciliación de servicios — UneFibra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
  <script type="importmap">
  { "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
      "firebase/functions": "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js"
  } }
  </script>
  <link rel="icon" href="../assets/icons/favicon.png" type="image/png" />
  <style>
    /* KZ-UNEF-008 · Objetivos táctiles: la auditoría objetiva detectó selects de
       19 px y casillas de 13 px. En un móvil eso no se acierta con el pulgar. */
    #app-content select, #app-content .search input { min-height: 40px; padding: 8px 10px; }
    #app-content td input.sel { width: 24px; height: 24px; min-width: 24px; min-height: 24px; margin: 0; accent-color: currentColor; }
    #app-content tbody td:first-child { padding-block: 12px; }
    #app-content .btn { min-height: 36px; }
    #app-content .modal .btn { min-height: 40px; }
    #app-content .badge-estado.tone-cyan { background: rgba(0,176,240,.16); color: #67e8f9; }
    #app-content .badge-estado.tone-blue { background: rgba(96,165,250,.18); color: #93c5fd; }
    #app-content .badge-estado.tone-violet { background: rgba(167,139,250,.18); color: #c4b5fd; }
    #app-content .conc-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
    #app-content .conc-table-wrap:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
    #app-content .conc-table-hint { display: none; margin: 0 0 8px; color: var(--text-muted); font-size: 13px; }
    #app-content .conc-modal { position: relative; }
    #app-content .conc-modal-close {
      position: sticky; top: 0; float: right; z-index: 2;
      width: 44px; height: 44px; margin: -14px -14px 0 12px;
      border: 1px solid var(--line); border-radius: 12px;
      background: var(--bg-soft); color: var(--text); font-size: 26px; line-height: 1;
    }
    #app-content .conc-modal-close:hover, #app-content .conc-modal-close:focus-visible { border-color: var(--cyan); color: var(--cyan); outline: none; }
    #app-content .conc-risk { display: grid; gap: 4px; margin: 14px 0; padding: 12px 14px; border-radius: 10px; }
    #app-content .conc-risk span { font-size: 13px; }
    #app-content .conc-risk--expired { border: 1px solid rgba(251,191,36,.55); background: rgba(251,191,36,.13); color: #fde68a; }
    #app-content .conc-risk--blocked { border: 1px solid rgba(248,113,113,.6); background: rgba(248,113,113,.14); color: #fecaca; }
    #app-content .btn--warning { background: #fbbf24; border-color: #fbbf24; color: #241500; }
    #app-content .btn--warning:hover:not(:disabled), #app-content .btn--warning:focus-visible:not(:disabled) { background: #fcd34d; border-color: #fcd34d; outline: 3px solid rgba(251,191,36,.25); }
    #app-content .btn--warning:disabled { background: rgba(248,113,113,.18); border-color: rgba(248,113,113,.5); color: #fecaca; }
    /* KZ-UNEF-010 · Revisión visual de Darwin:
       (a) en 320 px los indicadores iban uno por fila y empujaban buscador y
           lista demasiado abajo: ahora dos por fila.
       (b) entre 768 y 1024 px la columna de acciones quedaba cortada: se reduce
           el relleno de celdas y se fija la última columna a la derecha. */
    @media (max-width: 480px) {
      #app-content .card { flex: 1 1 46% !important; min-width: 0 !important; }
      #app-content .card > div:nth-child(2) { font-size: 22px; }
    }
    @media (min-width: 768px) and (max-width: 1024px) {
      #app-content table th, #app-content table td { padding: 8px 6px; font-size: 13px; }
      #app-content table th:last-child, #app-content table td:last-child {
        white-space: nowrap;
      }
    }
    /* El modal nunca debe esconder sus botones: cabecera y pie visibles con
       cuerpo desplazable, en cualquier altura de pantalla. */
    #app-content .conc-modal, #app-content .modal {
      max-height: calc(100vh - 32px); display: flex; flex-direction: column;
    }
    #app-content .conc-modal > :first-child { flex: 0 0 auto; position: sticky; top: 0; z-index: 3; }
    /* El cuerpo del modal se desplaza; el pie con las acciones queda siempre
       alcanzable (en 320x640 los botones quedaban fuera de la ventana). */
    #app-content .modal { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    #app-content .modal > div:last-child { position: sticky; bottom: 0; padding: 10px 0 2px; }
    @media (max-width: 480px) {
      #app-content .toolbar { gap: 10px; }
      #app-content .toolbar > * { flex: 1 1 100%; }
      #app-content .btn { min-height: 44px; }
      #app-content td input.sel { width: 28px; height: 28px; }
      #app-content .conc-table-hint { display: block; }
      #app-content .conc-modal { padding-top: 18px; }
    }
    /* KZ-UNEF-012 · TRES ZONAS. Estas reglas van al final del bloque para ganar
       a las antiguas (misma especificidad, posterior en el orden de cascada):
       anulan el aspa absoluta, el sticky del primer hijo y el padding-top. */
    #app-content .conc-modal {
      display: flex; flex-direction: column;
      max-height: calc(100dvh - 24px); overflow: hidden; padding: 0;
      position: fixed;
    }
    #app-content .conc-modal > :first-child { position: static; }
    #app-content .conc-modal-header {
      flex: 0 0 auto; display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 16px 10px; background: #0b1220;
      border-bottom: 1px solid rgba(148,163,184,.3);
    }
    #app-content .conc-modal-titulo { flex: 1 1 auto; min-width: 0; }
    #app-content .conc-modal-titulo h2 { margin: 0; font-size: 20px; word-break: break-word; }
    #app-content .conc-modal-titulo p { margin: 4px 0 0; font-size: 13px; }
    #app-content .conc-modal-close {
      position: static; flex: 0 0 auto; width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; border: 1px solid rgba(148,163,184,.45);
      border-radius: 8px; font-size: 20px; line-height: 1; cursor: pointer;
    }
    #app-content .conc-modal-body {
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
      overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
      padding: 12px 16px;
    }
    #app-content .conc-modal-footer {
      flex: 0 0 auto; display: flex; gap: 8px; justify-content: flex-end;
      flex-wrap: wrap; padding: 12px 16px; background: #0b1220;
      border-top: 1px solid rgba(148,163,184,.3);
    }
    @media (max-width: 480px) {
      #app-content .conc-modal { max-height: calc(100dvh - 12px); width: calc(100vw - 16px); }
      #app-content .conc-modal-footer .btn { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <div id="app-shell"></div>
  <script src="../assets/js/config.js"></script>
  <script type="module" src="conciliacion.js"></script>
</body>
</html>
